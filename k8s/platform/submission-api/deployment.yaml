apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-api
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: submission-api
  template:
    metadata:
      labels:
        app: submission-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: submission-api
          image: ghcr.io/agrawalx/submission-api:dev
          ports:
            - containerPort: 8080
          env:
            # In-cluster Loki push endpoint (logger appends /loki/api/v1/push).
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: submission-api-secret
                  key: database-url
            - name: MINIO_ENDPOINT
              value: minio.data.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: submission-api-secret
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: submission-api-secret
                  key: minio-secret-key
            - name: MINIO_BUCKET
              value: submissions
            # Create the submissions bucket on startup if MinIO doesn't have it yet,
            # so a fresh cluster doesn't 500 every upload with "bucket does not exist".
            - name: MINIO_CREATE_BUCKET_IF_MISSING
              value: "true"
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: ENVIRONMENT
              value: prod
            - name: METRICS_PORT
              value: "8080"
            # ── Load-shape knobs (scenario builder) ──────────────────────────
            # Durations (whole seconds) and aggregate-RPS budgets for the three
            # canonical scenarios. The participant mix (HFT/Retail/Inst) and
            # per-bot rates are fixed; bot counts derive from (budget / per-bot).
            # See .env.example "workload recipes" for tuned profiles + the
            # spike-shape knobs (SPIKE_PREWINDOW_S, SPIKE_BURST_S).
            - name: CONSTANT_DURATION_S
              value: "60"
            - name: SPIKE_DURATION_S
              value: "60"
            - name: RAMP_DURATION_S
              value: "180"
            - name: CONSTANT_TOTAL_RPS
              value: "10000"
            - name: SPIKE_PEAK_RPS
              value: "50000"
            - name: RAMP_PEAK_RPS
              value: "90000"
            # Seeding is INSERT ... ON CONFLICT DO NOTHING by default, so changing
            # the values above does NOT touch an already-seeded scenarios table on
            # restart. Flip this to "true" to upsert (rewrite duration + task_specs
            # from the env above, preserving scenario_id), then restart this
            # Deployment to apply. Leave "false" in steady state.
            - name: RESEED_SCENARIOS
              value: "false"
          # Liveness: static /health (no deps) — restart only on a hung process.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness: /ready pings Postgres, so a replica whose DB connection
          # died is pulled from the Service endpoints instead of serving errors.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: tmp
          emptyDir: {}

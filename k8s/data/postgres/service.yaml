# k8s/data/postgres/service.yaml
#
# This file declares Kubernetes resources for k8s/data/postgres.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
    - name: metrics
      port: 9187
      targetPort: 9187
  clusterIP: None

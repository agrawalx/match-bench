apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: data
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: kafka-topic-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: kafka-topic-init
          image: apache/kafka:3.7.1
          command: ["/bin/bash", "-ec"]
          args:
            - |
              # Problem: producers must not auto-create topics because broker
              # defaults cannot enforce the schema topic contract. Fix: this
              # Job pre-creates every topic with explicit partitions/RF/config.
              broker="kafka-0.kafka.data.svc.cluster.local:9092"
              create_topic() {
                topic="$1"
                partitions="$2"
                retention_ms="$3"
                /opt/kafka/bin/kafka-topics.sh \
                  --bootstrap-server "$broker" \
                  --create \
                  --if-not-exists \
                  --topic "$topic" \
                  --partitions "$partitions" \
                  --replication-factor 3 \
                  --config min.insync.replicas=2 \
                  --config retention.ms="$retention_ms" \
                  --config max.message.bytes=1048576
              }

              create_topic submission.build.requested 3 604800000
              create_topic submission.status.updated 3 604800000
              create_topic benchmark.requested 3 604800000
              create_topic benchmark.status.updated 3 604800000
              create_topic workload.assignments 24 86400000
              create_topic barrier 3 86400000
              create_topic bot.ready 3 86400000
              create_topic workload.failed 3 604800000
              create_topic orders.sent 24 86400000
              create_topic orders.acked 24 86400000
              create_topic scores.correctness 3 2592000000
              create_topic leaderboard.updates 3 604800000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}

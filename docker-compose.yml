# Local dev data services.
# Application services run with go run / cargo run.
# Add optional stacks with:
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml -f docker-compose.observability.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iicpc
      POSTGRES_PASSWORD: iicpc
      POSTGRES_DB: iicpc
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with a local postgres install
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iicpc"]
      interval: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console: http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:

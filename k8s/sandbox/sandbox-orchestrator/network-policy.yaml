# k8s/sandbox/sandbox-orchestrator/network-policy.yaml
#
# This file declares Kubernetes resources for k8s/sandbox/sandbox-orchestrator.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-orchestrator-egress
  namespace: sandbox
spec:
  podSelector:
    matchLabels:
      app: sandbox-orchestrator
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: benchmark
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 8080
          protocol: TCP

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 3100
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# k8s/data/kafka/statefulset.yaml
#
# This file declares Kubernetes resources for k8s/data/kafka.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: data
spec:
  serviceName: kafka
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9308"
    spec:
      automountServiceAccountToken: false
      # One broker per node: the brokers must not co-locate or a node loss takes
      # out multiple brokers and they contend for the same page cache / NIC.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: kafka
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          ports:
            - containerPort: 9092
            - containerPort: 9093
          command: ["/bin/bash", "-ec"]
          args:
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              exec /etc/kafka/docker/run
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka.data.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.data.svc.cluster.local:9093,1@kafka-1.kafka.data.svc.cluster.local:9093,2@kafka-2.kafka.data.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            # Topic data on the persistent PVC (mounted at /opt/kafka/data), NOT the
            # image default /tmp/kafka-logs (an emptyDir) — otherwise every broker
            # restart WIPES all topics. This was a real incident: a resource bump
            # restarted the broker and lost every topic.
            # A SUBDIRECTORY of the PVC, not the mount root: the root holds ext4's
            # `lost+found`, which Kafka's log loader tries to parse as a topic-partition
            # dir and crashes on (parseTopicPartitionName). The subdir is clean.
            - name: KAFKA_LOG_DIRS
              value: "/opt/kafka/data/logs"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "1048576"
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: cluster-id
          volumeMounts:
            - name: data
              mountPath: /opt/kafka/data
            - name: tmp
              mountPath: /tmp
            - name: kafka-logs
              mountPath: /opt/kafka/logs
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            # Kafka throughput is page-cache + CPU bound. 8Gi limit gives real page
            # cache (the 2Gi default forced every produce to disk and was a key cause
            # of the telemetry-producer backlog); cpu req kept at 1 so the general
            # pool's total requests fit 2x m6i.xlarge, limit 4 for burst headroom.
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args:
            - --kafka.server=localhost:9092
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

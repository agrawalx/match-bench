# Redis — the hot per-contestant snapshot the leaderboard reads without a DB
# round-trip. Single replica; the data is a rebuildable cache (TimescaleDB is the
# durable store), so no replication in v1.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: data
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        # redis_exporter sidecar (below) exposes metrics on 9121.
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9121"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"] # cache only — no persistence
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
        # redis_exporter sidecar — Redis has no auth (cache only), so the
        # exporter connects to redis://localhost:6379. securityContext mirrors
        # the postgres-exporter style.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.62.0-alpine
          args:
            - --redis.addr=redis://localhost:6379
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 59000
            runAsGroup: 59000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      securityContext:
        runAsNonRoot: true

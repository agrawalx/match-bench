# The platform namespace is default-deny. The frontend is a static SPA + nginx
# proxy: it only needs to (1) be reachable on 8080 (from the ingress controller
# and, for the proxy hop, intra-namespace), and (2) reach leaderboard-api (/api)
# AND submission-api (/sapi) in the same namespace, plus DNS. It touches no
# database, Kafka, or Redis directly — the APIs it proxies to do that.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
  namespace: platform
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Public traffic arrives via the ingress controller. Adjust the namespace
    # label to match your ingress controller's namespace if it is not labelled
    # `name: ingress-nginx`.
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # Proxy hops to the two platform APIs (same namespace, port 8080):
    #   /api/*  -> leaderboard-api,  /sapi/* -> submission-api.
    - to:
        - podSelector:
            matchLabels:
              app: leaderboard-api
        - podSelector:
            matchLabels:
              app: submission-api
      ports:
        - port: 8080
          protocol: TCP
    # DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

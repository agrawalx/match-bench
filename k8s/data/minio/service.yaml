# k8s/data/minio/service.yaml
#
# This file declares Kubernetes resources for k8s/data/minio.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: data
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

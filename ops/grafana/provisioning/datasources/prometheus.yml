# ops/grafana/provisioning/datasources/prometheus.yml
#
# This file configures operational tooling for prometheus.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: 1

datasources:
  - name: IICPC Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: iicpc-prometheus
    isDefault: false

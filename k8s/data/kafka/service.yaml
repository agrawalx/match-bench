apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
    - name: metrics
      port: 9308
      targetPort: 9308
  clusterIP: None   # headless — stable DNS: kafka-0.kafka.data.svc.cluster.local
  # KRaft brokers must resolve each other to form the controller quorum BEFORE any
  # is Ready; without this their per-pod DNS isn't published while not-ready, so the
  # quorum never forms (bootstrap deadlock).
  publishNotReadyAddresses: true

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-lint-test:
    name: Go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.10"
          cache: true

      - name: go vet (schemas)
        working-directory: schemas/go
        run: go vet ./...

      - name: go vet (submission-api)
        working-directory: services/submission-api
        run: go vet ./...

      - name: go test (submission-api)
        working-directory: services/submission-api
        run: go test -race -count=1 ./...

      - name: go vet (build-worker)
        working-directory: services/build-worker
        run: go vet ./...

      - name: go build (build-worker binaries)
        working-directory: services/build-worker
        run: |
          go build ./cmd/worker
          go build ./cmd/spawner
          go build ./cmd/fetcher

  rust-check:
    name: Rust fmt & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Rust source files
        id: rust
        run: |
          if find . -name "*.rs" -not -path "*/target/*" | grep -q .; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No Rust source files found — skipping Rust checks"
          fi

      - name: Set up Rust
        if: steps.rust.outputs.found == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.rust.outputs.found == 'true'
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: steps.rust.outputs.found == 'true'
        run: cargo fmt --all -- --check

      - name: cargo check
        if: steps.rust.outputs.found == 'true'
        run: cargo check --workspace

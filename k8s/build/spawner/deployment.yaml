apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawner
  namespace: build
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spawner
  template:
    metadata:
      labels:
        app: spawner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: build-spawner
      containers:
        - name: spawner
          image: ghcr.io/agrawalx/spawner:dev
          ports:
            - name: metrics
              containerPort: 9090
          env:
            # In-cluster Loki push endpoint (logger appends /loki/api/v1/push).
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: METRICS_PORT
              value: "9090"
            - name: ENVIRONMENT
              value: prod
            - name: SPAWNER_IMAGE
              value: ghcr.io/agrawalx/spawner:dev
            - name: K8S_NAMESPACE
              value: build
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: database-url
            - name: MINIO_ENDPOINT
              value: minio.data.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: minio-secret-key
            - name: MINIO_BUCKET
              value: submissions
            - name: JOB_SECRET_NAME
              value: spawner-secret
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: KAFKA_GROUP_ID
              value: build-worker-spawner
            - name: HARBOR_STAGING_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-staging-endpoint
            - name: HARBOR_PRODUCTION_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-production-endpoint
            - name: HARBOR_PROJECT
              value: agrawalx
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-user
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-password
            # REGISTRY_PROVIDER=ecr makes the spawner pre-create the staging and
            # production repositories via the ECR API before kaniko pushes and
            # before crane promotes — ECR has no push-to-create, so without this
            # every contestant's first push fails. Credentials come from the
            # default AWS chain: on EKS, annotate the build-spawner
            # ServiceAccount with an IAM role allowed to call
            # ecr:CreateRepository (IRSA). Leave unset/commented for
            # push-to-create registries (Harbor/ghcr).
            # - name: REGISTRY_PROVIDER
            #   value: ecr
            # REGISTRY_INSECURE=true downgrades kaniko/trivy/syft/crane to plain
            # HTTP / skipped TLS verification for the registry endpoints. Only
            # flip this for a local dev registry served over plain HTTP. The old
            # behavior of auto-downgrading any 10.*/172.*/192.168.* endpoint is
            # gone (those are EKS VPC CIDRs); loopback and kind-registry
            # endpoints remain auto-insecure for dev convenience.
            - name: REGISTRY_INSECURE
              value: "false"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

# k8s/benchmark/score-computer/deployment.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/score-computer.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: score-computer
  namespace: benchmark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: score-computer
  template:
    metadata:
      labels:
        app: score-computer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: score-computer
          image: ghcr.io/agrawalx/score-computer:demo
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: score-computer-secret
                  key: database-url
            - name: TIMESCALE_URL
              valueFrom:
                secretKeyRef:
                  name: score-computer-secret
                  key: timescale-url
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: score-computer-secret
                  key: kafka-brokers
            - name: REDIS_ADDR
              valueFrom:
                secretKeyRef:
                  name: score-computer-secret
                  key: redis-addr
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: SCORER_CONCURRENCY
              value: "4"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

# Placeholder per DECISIONS.md §22.
# Create the real secret imperatively:
#
#   source .env
#   kubectl create secret generic bot-fleet-controller-secret -n benchmark \
#     --from-literal=database-url="postgres://iicpc:$POSTGRES_PASSWORD@postgres.data.svc.cluster.local:5432/iicpc" \
#     --from-literal=harbor-production-endpoint="$HARBOR_PRODUCTION_ENDPOINT"
#
# Never `kubectl apply -f secret.yaml` — that loads the changeme values into
# the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: bot-fleet-controller-secret
  namespace: benchmark
type: Opaque
stringData:
  database-url: changeme
  harbor-production-endpoint: changeme

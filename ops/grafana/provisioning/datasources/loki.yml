# ops/grafana/provisioning/datasources/loki.yml
#
# This file configures operational tooling for loki.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: 1

datasources:
  - name: IICPC Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: iicpc-loki
    isDefault: true
    jsonData:
      maxLines: 1000

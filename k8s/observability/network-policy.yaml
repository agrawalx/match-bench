# k8s/observability/network-policy.yaml
#
# This file declares Kubernetes resources for k8s/observability.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: observability-default
  namespace: observability
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - {}

  egress:
    - to:
        - namespaceSelector: {}

    - ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# k8s/build/rbac.yaml
#
# This file declares Kubernetes resources for k8s/build.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-spawner
  namespace: build
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: job-manager
  namespace: build
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spawner-job-manager
  namespace: build
subjects:
  - kind: ServiceAccount
    name: build-spawner
    namespace: build
roleRef:
  kind: Role
  name: job-manager
  apiGroup: rbac.authorization.k8s.io

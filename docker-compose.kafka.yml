x-kafka-common-env: &kafka-common-env
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-1:9093,1@kafka-2:9093,2@kafka-3:9093"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_MIN_INSYNC_REPLICAS: "2"
  KAFKA_MESSAGE_MAX_BYTES: "1048576"
  CLUSTER_ID: "local-dev-cluster-id-000"

x-kafka-healthcheck: &kafka-healthcheck
  test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
  interval: 10s
  retries: 5

services:
  kafka-1:
    image: apache/kafka:3.7.1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "0"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092"
    ports:
      - "9092:9094"   # reach Kafka from host at localhost:9092
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-2:
    image: apache/kafka:3.7.1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9095"
    ports:
      - "9095:9094"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-3:
    image: apache/kafka:3.7.1
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9096"
    ports:
      - "9096:9094"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck: *kafka-healthcheck

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./ops/kafka/create-topics.sh:/opt/iicpc/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/opt/iicpc/create-topics.sh"]

volumes:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:

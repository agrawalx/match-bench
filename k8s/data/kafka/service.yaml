# k8s/data/kafka/service.yaml
#
# This file declares Kubernetes resources for k8s/data/kafka.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
    - name: metrics
      port: 9308
      targetPort: 9308
  clusterIP: None
  publishNotReadyAddresses: true

# k8s/benchmark/bot-fleet/deployment.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/bot-fleet.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-fleet-worker
  namespace: benchmark
spec:
  replicas: 5
  selector:
    matchLabels:
      app: bot-fleet-worker
  template:
    metadata:
      labels:
        app: bot-fleet-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: bot-fleet-worker
          image: ghcr.io/agrawalx/bot-fleet:dev
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: KAFKA_CONSUMER_GROUP
              value: bot-fleet
            - name: MAX_BOTS_PER_WORKER
              value: "1000"
            - name: TELEMETRY_BATCH_SIZE
              value: "1000"
            - name: MAX_POLL_INTERVAL_MS
              value: "1800000"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 2Gi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

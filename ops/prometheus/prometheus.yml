# ops/prometheus/prometheus.yml
#
# This file configures operational tooling for prometheus.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/iicpc-alerts.yml

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "pg_up|pg_database_size_bytes|pg_locks_count|pg_stat_activity_count|pg_stat_activity_max_tx_duration|pg_stat_database_(xact_commit|xact_rollback|deadlocks|numbackends|blks_hit|blks_read|temp_bytes|temp_files|tup_inserted|tup_updated|tup_deleted|tup_fetched|conflicts)|pg_exporter_last_scrape_error|pg_exporter_scrapes_total|pg_scrape_collector_success|pg_scrape_collector_duration_seconds"
        action: keep

  - job_name: submission-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

  - job_name: build-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

  - job_name: bot-fleet-controller
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8081"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

  - job_name: sandbox-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8082"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

  - job_name: rust-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:9093"
          - "host.docker.internal:9094"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

  - job_name: score-computer
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9195"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

  - job_name: leaderboard-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9196"]
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "iicpc_.*"
        action: keep

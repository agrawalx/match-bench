# k8s/benchmark/bot-fleet-controller/deployment.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/bot-fleet-controller.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-fleet-controller
  namespace: benchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bot-fleet-controller
  template:
    metadata:
      labels:
        app: bot-fleet-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bot-fleet-controller
          image: ghcr.io/agrawalx/bot-fleet-controller:dev
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: prod
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: SANDBOX_ORCHESTRATOR_URL
              value: http://sandbox-orchestrator.sandbox.svc.cluster.local:8080
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-fleet-controller-secret
                  key: database-url
            - name: MAX_TASKS_PER_WORKER
              value: "1000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

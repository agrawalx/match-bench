# k8s/build/spawner/deployment.yaml
#
# This file declares Kubernetes resources for k8s/build/spawner.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: spawner
  namespace: build
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spawner
  template:
    metadata:
      labels:
        app: spawner
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: build-spawner
      containers:
        - name: spawner
          image: ghcr.io/agrawalx/spawner:demo
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: METRICS_PORT
              value: "9090"
            - name: ENVIRONMENT
              value: prod
            - name: SPAWNER_IMAGE
              value: ghcr.io/agrawalx/spawner:demo
            - name: K8S_NAMESPACE
              value: build
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: database-url
            - name: MINIO_ENDPOINT
              value: minio.data.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: minio-secret-key
            - name: MINIO_BUCKET
              value: submissions
            - name: JOB_SECRET_NAME
              value: spawner-secret
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: KAFKA_GROUP_ID
              value: build-worker-spawner
            - name: HARBOR_STAGING_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-staging-endpoint
            - name: HARBOR_PRODUCTION_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-production-endpoint
            - name: HARBOR_PROJECT
              value: agrawalx
            - name: HARBOR_USER
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-user
            - name: HARBOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spawner-secret
                  key: harbor-password
            - name: REGISTRY_INSECURE
              value: "false"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

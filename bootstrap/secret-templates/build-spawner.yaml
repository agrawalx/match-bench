# bootstrap/secret-templates/build-spawner.yaml
#
# This file documents the secret shape required by build spawner.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: Secret
metadata:
  name: spawner-secret
  namespace: build
type: Opaque
data:
  database-url: ""
  minio-access-key: ""
  minio-secret-key: ""
  harbor-staging-endpoint: ""
  harbor-production-endpoint: ""
  harbor-user: ""
  harbor-password: ""

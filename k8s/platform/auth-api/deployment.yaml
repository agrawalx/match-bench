apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: platform
  labels:
    app: auth-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      containers:
        - name: auth-api
          image: iicpc/auth-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-client-secret
            - name: GOOGLE_ALLOWED_REDIRECT_URIS
              valueFrom:
                secretKeyRef:
                  name: auth-api-secret
                  key: google-allowed-redirect-uris
            - name: AUTH_COOKIE_SECURE
              value: "true"
            - name: AUTH_COOKIE_SAMESITE
              value: "lax"
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

# k8s/benchmark/ebpf-latency/job-template.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/ebpf-latency.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: batch/v1
kind: Job
metadata:
  name: capture-<SLOT_ID>
  namespace: sandbox
  labels:
    app: ebpf-capture
    slot: <SLOT_ID>
    app.kubernetes.io/managed-by: sandbox-orchestrator
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: ebpf-capture
        slot: <SLOT_ID>
        app.kubernetes.io/managed-by: sandbox-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      restartPolicy: Never
      nodeName: <ALGO_POD_NODE>
      hostPID: true
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
      containers:
        - name: capture
          image: <CAPTURE_IMAGE>
          ports:
            - name: metrics
              containerPort: 9090
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # 4 (was 2): at >150k delivered the userspace drain+parse+publish wants
              # ~3 cores; a 2-core cap CFS-throttled it and caused ringbuf drops. Fits
              # the c6i.2xlarge (8 vCPU) sandbox node alongside the contestant (ALGO_CPU=4).
              cpu: "4"
              memory: 512Mi
          securityContext:
            privileged: true
            capabilities:
              add: [BPF, NET_ADMIN, SYS_ADMIN]
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
          env:
            - name: RUST_LOG
              value: info
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: SESSION_ID
              value: <SLOT_ID>
            - name: CONTESTANT_ID
              value: <CONTESTANT_ID>
            - name: EBPF_IFACE
              value: eth0
            - name: EBPF_ALGO_POD_UID
              value: <ALGO_POD_UID>
            - name: EBPF_ALGO_CONTAINER_ID
              value: <ALGO_CONTAINER_ID>
            - name: EBPF_OBJECT_PATH
              value: /opt/iicpc/ebpf/libiicpc_ebpf_latency.so
            - name: KAFKA_BROKERS
              value: <KAFKA_BROKERS>

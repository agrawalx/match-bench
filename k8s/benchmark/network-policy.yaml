# k8s/benchmark/network-policy.yaml
#
# This file declares Kubernetes resources for k8s/benchmark.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-default
  namespace: benchmark
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 3100
          protocol: TCP

    - to:
        - namespaceSelector:
            matchLabels:
              name: sandbox

    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - port: 9092
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP

    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# Isolates all pods in the build namespace.
# Build Jobs (runner containers) may only reach:
#   - PostgreSQL  (data namespace, port 5432)
#   - Kafka       (data namespace, port 9092)
#   - MinIO       (data namespace, port 9000)
#   - Harbor      (data namespace, port 443)
#   - DNS         (kube-system, port 53)
# Everything else — other namespaces, internet — is denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: build-jobs-isolation
  namespace: build
spec:
  podSelector: {}   # applies to every pod in this namespace
  policyTypes:
    - Ingress
    - Egress

  # Deny all ingress — nothing should be calling into build Jobs
  ingress: []

  egress:
    # Data plane: PostgreSQL, Kafka, MinIO, Harbor
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - port: 5432    # PostgreSQL
          protocol: TCP
        - port: 9092    # Kafka
          protocol: TCP
        - port: 9000    # MinIO S3 API
          protocol: TCP
        - port: 443     # Harbor HTTPS
          protocol: TCP

    # DNS resolution (kube-dns in kube-system)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

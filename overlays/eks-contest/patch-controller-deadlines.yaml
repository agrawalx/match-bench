# EKS deploy deadline (2026-08-03). Base default is 60s, which is generous on
# local k3s — every image is pre-imported into containerd and the single node
# is always present, so a slot is ready in ~2s. On EKS a slot's pod must be
# SCHEDULED (possibly waiting on a node that is still joining) and then pull
# the contestant image from ECR for the FIRST time; measured here at ~40-60s,
# i.e. right at the edge of the old budget — the run failed with "slot did not
# become ready within 1m0s" while the algo container had in fact started
# seconds earlier. Contest day is all cold pulls, so 300s.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-fleet-controller
  namespace: benchmark
spec:
  template:
    spec:
      containers:
        - name: bot-fleet-controller
          env:
            - name: DEPLOY_DEADLINE
              value: 300s

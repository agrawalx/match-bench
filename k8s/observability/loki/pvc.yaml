# Loki chunk + index storage. Default StorageClass, ReadWriteOnce — the
# single-binary Loki is a single replica (Recreate strategy).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: observability
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi

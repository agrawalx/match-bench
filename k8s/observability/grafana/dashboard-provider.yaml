# Grafana dashboard provider — loads JSON dashboards from disk. Mounted at
# /etc/grafana/provisioning/dashboards; the JSON files come from the
# grafana-dashboards ConfigMap mounted at /var/lib/grafana/dashboards.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: iicpc
        orgId: 1
        folder: IICPC
        type: file
        disableDeletion: false
        editable: true
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: false

# Local dev environment — data services only.
# Application services (submission-api, build-worker) run with go run / cargo run.
# Add redis: and harbor: blocks here when you need them locally.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iicpc
      POSTGRES_PASSWORD: iicpc
      POSTGRES_DB: iicpc
    ports:
      - "5433:5432"   # 5433 on host to avoid conflict with a local postgres install
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iicpc"]
      interval: 5s
      retries: 5

  # TimescaleDB — metrics time-series for the telemetry-ingester. Separate
  # instance from the metadata postgres (per architecture_v2). The image ships
  # the timescaledb extension preloaded; the ingester creates the hypertable.
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: iicpc
      POSTGRES_PASSWORD: iicpc
      POSTGRES_DB: metrics
    ports:
      - "5434:5432"   # 5434 on host to avoid the metadata postgres (5433)
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "iicpc", "-d", "metrics"]
      interval: 5s
      retries: 5

  # Redis — hot per-contestant snapshot the leaderboard reads without a DB hit.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2024-07-16T23-46-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console — open http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      retries: 5

  # Problem: a single local broker forced RF=1 topics and hid production
  # replication/ISR failures. Fix: run a three-broker KRaft cluster locally.
  kafka-1:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-1:9093,1@kafka-2:9093,2@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Problem: broker auto-create can create typo/missing topics with
      # defaults. Fix: disable it and let kafka-init create all schema topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_MESSAGE_MAX_BYTES: "1048576"
      CLUSTER_ID: "local-dev-cluster-id-000"
    ports:
      - "9092:9094"   # reach Kafka from host at localhost:9092
    volumes:
      - kafka_1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 5

  kafka-2:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:9092,EXTERNAL://localhost:9095"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-1:9093,1@kafka-2:9093,2@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Problem: broker auto-create can create typo/missing topics with
      # defaults. Fix: disable it and let kafka-init create all schema topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_MESSAGE_MAX_BYTES: "1048576"
      CLUSTER_ID: "local-dev-cluster-id-000"
    ports:
      - "9095:9094"
    volumes:
      - kafka_2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 5

  kafka-3:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:9092,EXTERNAL://localhost:9096"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-1:9093,1@kafka-2:9093,2@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Problem: broker auto-create can create typo/missing topics with
      # defaults. Fix: disable it and let kafka-init create all schema topics.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_MESSAGE_MAX_BYTES: "1048576"
      CLUSTER_ID: "local-dev-cluster-id-000"
    ports:
      - "9096:9094"
    volumes:
      - kafka_3_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 5

  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    # Problem: relying on runtime producer auto-create loses required
    # partitions/RF/retention. Fix: pre-create every schema topic explicitly.
    entrypoint:
      - /bin/bash
      - -lc
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic submission.build.requested --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic submission.status.updated --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic benchmark.requested --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic benchmark.status.updated --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic workload.assignments --partitions 24 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=86400000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic barrier --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=86400000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic bot.ready --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=86400000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic workload.failed --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic orders.sent --partitions 24 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=86400000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic orders.acked --partitions 24 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=86400000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic scores.correctness --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=2592000000 --config max.message.bytes=1048576 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists --topic leaderboard.updates --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000 --config max.message.bytes=1048576

  loki:
    image: grafana/loki:main-2e3da9a
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  grafana:
    image: grafana/grafana:main-distroless-slim
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: system
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro


volumes:
  postgres_data:
  timescale_data:
  redis_data:
  minio_data:
  loki_data:
  kafka_1_data:
  kafka_2_data:
  kafka_3_data:
  grafana_data:

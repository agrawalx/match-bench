apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-spawner
  namespace: build
  annotations:
    # IRSA role created by infra/terraform/irsa.tf (module.spawner_irsa). Baked in
    # here so the SA is born with it: the Terraform kubernetes_annotations approach
    # needs the SA to pre-exist, which a one-shot `terraform apply` can't guarantee.
    # The deploy step substitutes the real ARN from `terraform output irsa_role_arns`
    # (build_spawner), e.g. arn:aws:iam::<ACCOUNT_ID>:role/<cluster_name>-build-spawner.
    eks.amazonaws.com/role-arn: BUILD_SPAWNER_ROLE_ARN


apiVersion: v1
kind: Service
metadata:
  name: sandbox-orchestrator
  namespace: sandbox
spec:
  type: ClusterIP
  selector:
    app: sandbox-orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 8080
      protocol: TCP

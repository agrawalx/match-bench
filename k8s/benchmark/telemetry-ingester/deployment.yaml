# k8s/benchmark/telemetry-ingester/deployment.yaml
#
# This file declares Kubernetes resources for k8s/benchmark/telemetry-ingester.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingester
  namespace: benchmark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telemetry-ingester
  template:
    metadata:
      labels:
        app: telemetry-ingester
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: telemetry-ingester
          image: ghcr.io/agrawalx/telemetry-ingester:dev
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: KAFKA_BROKERS
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: KAFKA_BROKERS
            - name: TIMESCALE_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: TIMESCALE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: telemetry-ingester-secrets
                  key: REDIS_URL
            - name: KAFKA_CONSUMER_GROUP
              value: telemetry-ingester
            - name: RUST_LOG
              value: info
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      securityContext:
        runAsNonRoot: true

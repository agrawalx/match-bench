apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-orchestrator
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-orchestrator
  template:
    metadata:
      labels:
        app: sandbox-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: sandbox-orchestrator
      containers:
        - name: sandbox-orchestrator
          image: ghcr.io/agrawalx/sandbox-orchestrator:dev
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: prod
            - name: K8S_NAMESPACE
              value: sandbox
            # RUNTIME_CLASS is empty for dev k3s — algo pods get the default runtime.
            # In prod, set this to "gvisor" (after installing the runsc RuntimeClass).
            # Toggle pattern: empty value disables the feature, non-empty enables it
            # (same shape as BUILD_NODE_POOL on the spawner). Use this shape for any
            # future dev/prod-divergent k8s behaviour so the orchestrator pod spec
            # remains identical across environments and only the env value differs.
            - name: RUNTIME_CLASS
              value: ""
            # Equal request/limit makes algo pods Guaranteed QoS. Integer CPU
            # ("2", not "2000m") enables cpuset pinning when the sandbox node
            # pool's kubelet is configured with cpuManagerPolicy=static and
            # cpuManagerPolicyOptions.full-pcpus-only=true. The pod spec alone
            # is necessary but not sufficient — without those kubelet settings
            # the algo pod still gets equal request/limit but shares cores via
            # CFS bandwidth instead of getting an exclusive cpuset.
            - name: ALGO_CPU
              value: "2"
            - name: ALGO_MEMORY
              value: "1Gi"
            # Dedicated sandbox node pool. Empty in dev k3s (no taint exists).
            # Prod: set to "sandbox" with matching taint sandbox=true:NoSchedule
            # on the dedicated node pool. Mirrors BUILD_NODE_POOL.
            - name: SANDBOX_NODE_POOL
              value: ""
            # Per-pod NIC bandwidth caps. Read by the CNI bandwidth plugin
            # (and Cilium) from kubernetes.io/{egress,ingress}-bandwidth
            # annotations. Set to empty to disable.
            - name: ALGO_EGRESS_BANDWIDTH
              value: "100M"
            - name: ALGO_INGRESS_BANDWIDTH
              value: "100M"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true

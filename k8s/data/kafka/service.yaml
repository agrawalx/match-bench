apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: data
spec:
  selector:
    app: kafka
  ports:
    - name: client
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
  clusterIP: None   # headless — stable DNS: kafka-0.kafka.data.svc.cluster.local

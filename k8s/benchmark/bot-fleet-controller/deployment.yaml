apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-fleet-controller
  namespace: benchmark
spec:
  # Single replica — architecturally locked at 1. DO NOT SCALE.
  # The session map lives in memory only; if two replicas existed, the
  # bot.ready consumer group would shard messages across them and a
  # ReadySignal for session S could land on a replica that does not know
  # about S — fan-in for that session would never complete. Crash
  # recovery (mark-failed-on-restart) is the deliberate trade-off that
  # lets us keep the controller stateless across pods.
  replicas: 1
  strategy:
    # Prevent two replicas from briefly coexisting during rolling updates —
    # the second pod would consume bot.ready for an in-flight session it
    # doesn't know about and the first pod would never get the barrier fired.
    type: Recreate
  selector:
    matchLabels:
      app: bot-fleet-controller
  template:
    metadata:
      labels:
        app: bot-fleet-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: bot-fleet-controller
          image: ghcr.io/agrawalx/bot-fleet-controller:dev
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # In-cluster Loki push endpoint (logger appends /loki/api/v1/push).
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: prod
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: SANDBOX_ORCHESTRATOR_URL
              value: http://sandbox-orchestrator.sandbox.svc.cluster.local:8080
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-fleet-controller-secret
                  key: database-url
            # Per-pod fan-out: WorkerCount = ceil(scenario_tasks / this). Raise it
            # ABOVE a scenario's task count to pin ALL load on ONE pod (single-pod
            # capacity testing); lower it to spread load across more pods. MUST be
            # <= the bot-fleet replica count, and <= the worker's MAX_BOTS_PER_WORKER.
            - name: MAX_TASKS_PER_WORKER
              value: "1000"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

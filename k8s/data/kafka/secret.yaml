# DO NOT commit real credentials. Replace cluster-id with a random base64 UUID before applying.
# Generate cluster-id: python3 -c "import uuid,base64; print(base64.urlsafe_b64encode(uuid.uuid4().bytes+uuid.uuid4().bytes[:4]).decode().rstrip('='))"
apiVersion: v1
kind: Secret
metadata:
  name: kafka-secret
  namespace: data
type: Opaque
stringData:
  cluster-id: REPLACE_WITH_RANDOM_KRAFT_CLUSTER_ID

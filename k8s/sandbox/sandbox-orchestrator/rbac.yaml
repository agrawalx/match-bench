apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-orchestrator
  namespace: sandbox
---
# The orchestrator owns Pod + Service lifecycle for one slot per benchmark run.
#
# Least-privilege scope per platform rule: every service has its own
# ServiceAccount + Role + RoleBinding inside its own namespace. No ClusterRoles
# in v1. The verbs below are the minimum the orchestrator needs:
#   - create  → spawn a slot on POST /slots
#   - get     → fetch state for GET /slots/{id} and during readiness polling
#   - list    → rebuild the in-memory slot map on startup from label app=algo
#   - watch   → react to Pod transitions (Ready, Failed) for state derivation
#   - delete  → tear down Pod + Service on DELETE /slots/{id}
# Update/patch are intentionally absent — we never mutate live algo pods.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slot-manager
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-orchestrator-slot-manager
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-orchestrator
    namespace: sandbox
roleRef:
  kind: Role
  name: slot-manager
  apiGroup: rbac.authorization.k8s.io

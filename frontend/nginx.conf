# Unprivileged nginx (listens on 8080, runs as uid 101). Serves the static SPA
# and proxies /api/* to leaderboard-api in the same namespace. /api/events is an
# SSE stream, so buffering is disabled and timeouts are long for it.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: unknown paths fall back to index.html (client-side view switching).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Live SSE stream — no buffering, keep the connection open.
    location /api/events {
        proxy_pass http://leaderboard-api.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # REST API.
    location /api/ {
        proxy_pass http://leaderboard-api.platform.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

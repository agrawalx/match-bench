[package]
name = "iicpc-bot-fleet"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
futures = "0.3"
iicpc-schemas-rust = { path = "../../schemas/rust" }
# librdkafka via the rdkafka crate. dynamic-linking pulls the system
# librdkafka.so (apt: librdkafka-dev for build, librdkafka1 at runtime).
# Faster builds and no librdkafka rebuild on `cargo clean`; trade-off is a
# runtime dependency on the system library. SSL/SASL are off because the
# bot-fleet only talks to an in-cluster ClusterIP Kafka broker — enable
# them later when Kafka moves outside the cluster.
# Pinned to =0.36.0 because that release bundles librdkafka 2.3.0, matching
# the librdkafka1 version available in Debian Bookworm / Ubuntu 24.04 apt
# repos. Bumping rdkafka past 0.36.0 requires a newer librdkafka than the
# system package provides; either pin here, or move to cmake-build (which
# compiles librdkafka from source and brings its own build deps).
rdkafka = { version = "=0.36.0", default-features = false, features = ["dynamic-linking", "tokio"] }
rand = { version = "0.8", features = ["small_rng"] }
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

upstream leaderboard_api { server ${LEADERBOARD_API_HOST}:${LEADERBOARD_API_PORT}; keepalive 32; }
upstream submission_api { server ${SUBMISSION_API_HOST}:${SUBMISSION_API_PORT}; keepalive 16; }
upstream auth_api { server ${AUTH_API_HOST}:${AUTH_API_PORT}; keepalive 8; }
upstream next_app { server 127.0.0.1:3000; keepalive 16; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    limit_conn perip 20;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location ~* \.(js|css|woff2?|svg|png|ico|webmanifest)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://auth_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Strict";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location /api/leaderboard/v1/ {
        limit_req zone=api burst=20 nodelay;
        rewrite ^/api/leaderboard/v1/(.*)$ /api/$1 break;
        proxy_pass http://leaderboard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        include /etc/nginx/snippets/security_headers.inc;
    }

    location = /api/submission/v1/submissions {
        limit_req zone=upload burst=3 nodelay;
        proxy_pass http://submission_api/submit;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        client_max_body_size 105m;
        include /etc/nginx/snippets/security_headers.inc;
    }

    location ~ ^/api/submission/v1/submissions/([^/]+)/benchmark$ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://submission_api/submissions/$1/benchmark;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location ~ ^/api/submission/v1/submissions/([^/]+)$ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://submission_api/submissions/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location = /api/submission/v1/run-groups {
        limit_req zone=api burst=20 nodelay;
        rewrite ^ /run-groups break;
        proxy_pass http://submission_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location ~ ^/api/submission/v1/run-groups/([^/]+)$ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://submission_api/run-groups/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://next_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security_headers.inc;
    }

    location ~* \.(php|asp|aspx|cgi|env|git|htaccess|DS_Store)$ {
        return 404;
    }
}

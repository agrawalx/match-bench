apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: data
spec:
  clusterIP: None # headless, matches the StatefulSet serviceName
  selector:
    app: timescaledb
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP

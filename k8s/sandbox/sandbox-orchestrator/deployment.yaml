# k8s/sandbox/sandbox-orchestrator/deployment.yaml
#
# This file declares Kubernetes resources for k8s/sandbox/sandbox-orchestrator.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-orchestrator
  namespace: sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-orchestrator
  template:
    metadata:
      labels:
        app: sandbox-orchestrator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: sandbox-orchestrator
      containers:
        - name: sandbox-orchestrator
          image: ghcr.io/agrawalx/sandbox-orchestrator:demo
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LOKI_URL
              value: http://loki.observability.svc.cluster.local:3100
            - name: PORT
              value: "8080"
            - name: ENVIRONMENT
              value: prod
            - name: K8S_NAMESPACE
              value: sandbox
            - name: RUNTIME_CLASS
              value: ""
            - name: ALGO_CPU
              value: "2"
            - name: ALGO_MEMORY
              value: "1Gi"
            - name: SANDBOX_NODE_POOL
              value: ""
            - name: ALGO_EGRESS_BANDWIDTH
              value: "100M"
            - name: ALGO_INGRESS_BANDWIDTH
              value: "100M"
            - name: CAPTURE_ENABLED
              value: "true"
            - name: CAPTURE_IMAGE
              value: ghcr.io/agrawalx/ebpf-latency:demo
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: ALGO_IMAGE_PULL_SECRET
              value: ""
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532

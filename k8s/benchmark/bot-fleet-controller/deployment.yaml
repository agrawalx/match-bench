apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-fleet-controller
  namespace: benchmark
spec:
  # Single replica — architecturally locked at 1. DO NOT SCALE.
  # The session map lives in memory only; if two replicas existed, the
  # bot.ready consumer group would shard messages across them and a
  # ReadySignal for session S could land on a replica that does not know
  # about S — fan-in for that session would never complete. Crash
  # recovery (mark-failed-on-restart) is the deliberate trade-off that
  # lets us keep the controller stateless across pods.
  replicas: 1
  strategy:
    # Prevent two replicas from briefly coexisting during rolling updates —
    # the second pod would consume bot.ready for an in-flight session it
    # doesn't know about and the first pod would never get the barrier fired.
    type: Recreate
  selector:
    matchLabels:
      app: bot-fleet-controller
  template:
    metadata:
      labels:
        app: bot-fleet-controller
    spec:
      containers:
        - name: bot-fleet-controller
          image: ghcr.io/agrawalx/bot-fleet-controller:dev
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: SANDBOX_ORCHESTRATOR_URL
              value: http://sandbox-orchestrator.sandbox.svc.cluster.local:8080
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bot-fleet-controller-secret
                  key: database-url
            - name: HARBOR_PRODUCTION_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: bot-fleet-controller-secret
                  key: harbor-production-endpoint
            - name: HARBOR_PROJECT
              value: agrawalx
            # Scenarios now live in the PostgreSQL `scenarios` table, seeded
            # by submission-api on startup (constant / spike / ramp). The
            # controller loads the scenario for each benchmark.requested by
            # scenario_id; there are no scenario knobs in this deployment
            # any longer. To retune a scenario, edit the JSON in the
            # scenarios row directly.
            #
            # The few deploy-wide knobs that ARE per-deployment (deadlines,
            # FIX protocol version) fall back to sensible defaults in
            # main.go; override only if needed.
            # - name: DEPLOY_DEADLINE
            #   value: "60s"
            # - name: READY_DEADLINE
            #   value: "30s"
            # - name: BARRIER_SAFETY_GAP
            #   value: "500ms"
            # Uncomment when Loki is deployed.
            # - name: LOKI_URL
            #   value: http://loki.monitoring.svc.cluster.local:3100
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

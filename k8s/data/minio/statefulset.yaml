apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: data
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
      annotations:
        # MinIO serves native Prometheus metrics on the S3 API port (9000) at
        # /minio/v2/metrics/cluster. MINIO_PROMETHEUS_AUTH_TYPE=public (below)
        # makes the endpoint scrapeable without a bearer token.
        prometheus.io/scrape: "true"
        prometheus.io/path: /minio/v2/metrics/cluster
        prometheus.io/port: "9000"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-07-16T23-46-41Z
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000   # S3 API
            - containerPort: 9001   # web console
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            # Allow Prometheus to scrape /minio/v2/metrics/cluster without a
            # signed bearer token (in-cluster scrape only; not internet-exposed).
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      securityContext:
        runAsNonRoot: true
        # runAsNonRoot only asserts uid != 0; without an explicit numeric uid the
        # kubelet cannot verify it before start and the container fails with
        # CreateContainerConfigError (the minio image declares no USER).
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi

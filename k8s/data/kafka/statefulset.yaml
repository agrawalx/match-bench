# Three-node Kafka in KRaft mode (no ZooKeeper).
# For multi-broker production use, replace with the Strimzi operator.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: data
spec:
  serviceName: kafka
  replicas: 3
  # All 3 KRaft controllers must start together to bootstrap a quorum; the default
  # OrderedReady deadlocks (kafka-1/2 wait for kafka-0 Ready, but kafka-0 can't be
  # Ready until a 2-of-3 controller quorum forms).
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        # kafka-exporter sidecar (below) exposes broker/topic/consumer-group
        # metrics on 9308.
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9308"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: apache/kafka:3.7.1
          ports:
            - containerPort: 9092   # client
            - containerPort: 9093   # controller (KRaft)
          command: ["/bin/bash", "-ec"]
          args:
            - |
              export KAFKA_NODE_ID="${HOSTNAME##*-}"
              exec /etc/kafka/docker/run
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://$(POD_NAME).kafka.data.svc.cluster.local:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka.data.svc.cluster.local:9093,1@kafka-1.kafka.data.svc.cluster.local:9093,2@kafka-2.kafka.data.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_MESSAGE_MAX_BYTES
              value: "1048576"
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef:
                  name: kafka-secret
                  key: cluster-id
          volumeMounts:
            - name: data
              mountPath: /opt/kafka/data
            - name: tmp
              mountPath: /tmp
            - name: kafka-logs
              mountPath: /opt/kafka/logs
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext:
            # apache/kafka rewrites its config under /opt/kafka/config at startup,
            # which is on the image root fs — so the root fs cannot be read-only.
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
        # kafka-exporter sidecar — scrapes the local broker (PLAINTEXT, no auth)
        # for topic/partition/consumer-group lag metrics. securityContext mirrors
        # the postgres-exporter style. Each broker pod runs its own exporter; they
        # report the same cluster-wide view, so dashboards should aggregate/dedupe.
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.8.0
          args:
            - --kafka.server=localhost:9092
            - --web.listen-address=:9308
          ports:
            - name: metrics
              containerPort: 9308
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      securityContext:
        runAsNonRoot: true
        # apache/kafka's user is the non-numeric "appuser"; the kubelet needs a
        # numeric runAsUser to verify non-root under runAsNonRoot.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi

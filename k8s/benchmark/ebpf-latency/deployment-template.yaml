# Per-benchmark eBPF latency publisher template.
#
# This manifest is intentionally a one-replica Deployment template, not a
# cluster-wide DaemonSet. The current ebpf-latency binary attaches one XDP/tc
# pair to one contestant pod network namespace, so the controller/orchestrator
# should render this template once per benchmark session with:
#
#   IICPC_SESSION_ID        -> benchmark session id
#   IICPC_CONTESTANT_ID     -> contestant id
#   IICPC_CONTESTANT_NODE   -> nodeName of the contestant pod
#   IICPC_CONTESTANT_PID    -> host-visible PID for the contestant pod process
#
# Example render:
#   envsubst < deployment-template.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ebpf-latency-${IICPC_SESSION_ID}
  namespace: benchmark
  labels:
    app: ebpf-latency
    iicpc.dev/session-id: ${IICPC_SESSION_ID}
    iicpc.dev/contestant-id: ${IICPC_CONTESTANT_ID}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ebpf-latency
      iicpc.dev/session-id: ${IICPC_SESSION_ID}
  template:
    metadata:
      labels:
        app: ebpf-latency
        iicpc.dev/session-id: ${IICPC_SESSION_ID}
        iicpc.dev/contestant-id: ${IICPC_CONTESTANT_ID}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9090"
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      nodeName: ${IICPC_CONTESTANT_NODE}
      tolerations:
        - key: iicpc.dev/sandbox
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 10
      containers:
        - name: ebpf-latency
          image: iicpc-ebpf-latency:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9090
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - BPF
                - NET_ADMIN
                - SYS_ADMIN
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
          env:
            - name: RUST_LOG
              value: info
            - name: METRICS_PORT
              value: "9090"
            - name: ENVIRONMENT
              value: prod
            - name: KAFKA_BROKERS
              value: kafka.data.svc.cluster.local:9092
            - name: SESSION_ID
              value: ${IICPC_SESSION_ID}
            - name: CONTESTANT_ID
              value: ${IICPC_CONTESTANT_ID}
            - name: EBPF_IFACE
              value: eth0
            - name: EBPF_NETNS_PATH
              value: /proc/${IICPC_CONTESTANT_PID}/ns/net
            - name: EBPF_OBJECT_PATH
              value: /opt/iicpc/ebpf/iicpc_latency.bpf.o
            - name: EBPF_XDP_INGRESS_PROGRAM
              value: iicpc_xdp_ingress
            - name: EBPF_TC_EGRESS_PROGRAM
              value: iicpc_tc_egress
            - name: EBPF_FLUSH_INTERVAL_MS
              value: "5"
            - name: EBPF_BATCH_SIZE
              value: "4096"
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: ebpf-objects
              mountPath: /opt/iicpc/ebpf
              readOnly: true
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        # The current Dockerfile builds the userspace loader only. Until the
        # eBPF object is baked into the image by the build pipeline, provision
        # /opt/iicpc/ebpf/iicpc_latency.bpf.o on each sandbox node.
        - name: ebpf-objects
          hostPath:
            path: /opt/iicpc/ebpf
            type: Directory

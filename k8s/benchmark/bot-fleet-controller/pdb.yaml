# PodDisruptionBudget — bot-fleet-controller runs at exactly one replica
# (architecturally locked; no horizontal scale-out).
#
# Use maxUnavailable=1, NOT minAvailable=1. With a single replica, minAvailable=1
# yields disruptionsAllowed=0: the Eviction API refuses to evict the only pod and
# `kubectl drain` HANGS indefinitely, blocking routine node maintenance — strictly
# worse than no PDB. maxUnavailable=1 lets the pod be evicted and rescheduled (the
# brief in-flight gap is marked failed by recovery and the user re-triggers — the
# accepted v1 trade-off for a single-replica controller).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bot-fleet-controller
  namespace: benchmark
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: bot-fleet-controller

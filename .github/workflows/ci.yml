name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-lint-test:
    name: Go vet & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go vet (schemas)
        working-directory: schemas/go
        run: go vet ./...

      - name: go vet (submission-api)
        working-directory: services/submission-api
        run: go vet ./...

      - name: go test (submission-api)
        working-directory: services/submission-api
        run: go test -race -count=1 ./...

  rust-check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check (workspace)
        run: cargo check --workspace

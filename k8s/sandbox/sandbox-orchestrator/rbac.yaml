# k8s/sandbox/sandbox-orchestrator/rbac.yaml
#
# This file declares Kubernetes resources for k8s/sandbox/sandbox-orchestrator.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-orchestrator
  namespace: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: slot-manager
  namespace: sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-orchestrator-slot-manager
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: sandbox-orchestrator
    namespace: sandbox
roleRef:
  kind: Role
  name: slot-manager
  apiGroup: rbac.authorization.k8s.io

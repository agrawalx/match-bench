# benchmark namespace: bot-worker pods AND the bot-fleet-controller.
# Egress permits:
#   - sandbox (algo TCP order traffic + orchestrator HTTP at :8080)
#   - data:9092 (Kafka, all benchmark-namespace services)
#   - data:5432 (PostgreSQL, controller's runs-table reads + recovery writes)
#   - DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: benchmark-default
  namespace: benchmark
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  # Ingress from platform (controller probes / future direct calls).
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
    # Prometheus (observability namespace) scrapes the metrics endpoints:
    # bot-fleet-controller :8080, and bot-fleet-worker / telemetry-ingester /
    # correctness-validator :9090.
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 8080
          protocol: TCP
        - port: 9090
          protocol: TCP

  egress:
    # Loki log shipping — every benchmark service's logger pushes to
    # loki.observability.svc:3100 (LOKI_URL).
    - to:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 3100
          protocol: TCP

    # Sandbox: contestant pods on the contestant's port (bot orders) and the
    # sandbox-orchestrator HTTP API on :8080 (controller).
    - to:
        - namespaceSelector:
            matchLabels:
              name: sandbox

    # Data plane: Kafka and PostgreSQL.
    - to:
        - namespaceSelector:
            matchLabels:
              name: data
      ports:
        - port: 9092
          protocol: TCP
        - port: 5432 # postgres + timescaledb (metrics)
          protocol: TCP
        - port: 6379 # redis (telemetry-ingester hot snapshot)
          protocol: TCP

    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# k8s/data/network-policy.yaml
#
# This file declares Kubernetes resources for k8s/data.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-isolation
  namespace: data
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform
        - namespaceSelector:
            matchLabels:
              name: build
        - namespaceSelector:
            matchLabels:
              name: benchmark
    - from:
        - namespaceSelector:
            matchLabels:
              name: sandbox
      ports:
        - port: 9092
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - port: 9092
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - port: 9187
          protocol: TCP
        - port: 9121
          protocol: TCP
        - port: 9308
          protocol: TCP
        - port: 9000
          protocol: TCP

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector: {}
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP

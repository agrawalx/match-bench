# bootstrap/secret-templates/platform-auth-api.yaml
#
# This file documents the secret shape required by platform auth api.
# It is part of the IICPC platform configuration and should remain
# aligned with the deployment and operations guidance in the README.
# Keep comments at the file header so resource bodies stay declarative.

apiVersion: v1
kind: Secret
metadata:
  name: auth-api-secret
  namespace: platform
type: Opaque
stringData:
  google-client-id: "REPLACE-ME.apps.googleusercontent.com"
  google-client-secret: "REPLACE-ME"
  google-allowed-redirect-uris: "http://localhost:8080/auth/callback"

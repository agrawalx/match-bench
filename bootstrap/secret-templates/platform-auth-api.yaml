# Placeholder secret shape only. Create the real secret outside Git
# (bootstrap/secrets-live/, gitignored).
#
# google-allowed-redirect-uris is REQUIRED and fail-closed: auth-api refuses
# to start when it is empty (an empty allowlist used to mean allow-all).
# Comma-separated, must exactly match the URIs registered on the Google
# OAuth client, e.g.:
#   http://localhost:8080/auth/callback,https://contest.example.com/auth/callback
apiVersion: v1
kind: Secret
metadata:
  name: auth-api-secret
  namespace: platform
type: Opaque
stringData:
  google-client-id: "REPLACE-ME.apps.googleusercontent.com"
  google-client-secret: "REPLACE-ME"
  google-allowed-redirect-uris: "http://localhost:8080/auth/callback"
